<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f3f7fb;
            font-family: Arial, sans-serif;
            color: #1f2937;
        }

        .card {
            background: #ffffff;
            padding: 2rem 3rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
            text-align: center;
        }

        h1 {
            color: #0f766e;
            margin-bottom: 0.75rem;
        }

        p {
            margin-top: 0;
            font-size: 1.1rem;
        }

        button {
            margin-top: 0.5rem;
            padding: 0.75rem 1.25rem;
            border: none;
            border-radius: 10px;
            background: #0f766e;
            color: white;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1 id="greeting">Hello, Liberia!</h1>
        <p>Welcome to my first website.</p>
        <button id="changeMessage">Change greeting</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
